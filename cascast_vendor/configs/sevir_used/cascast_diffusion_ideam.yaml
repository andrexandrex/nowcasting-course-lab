# Stripped inference-only config derived from the original CasCast
# configs/sevir_used/cascast_diffusion_ideam.yaml.
# Dataset, sampler, trainer, optimizer and lr_scheduler sections are omitted.

model:
  type: latent_diffusion_model
  params:
    diffusion_kwargs:
      noise_scheduler:
        DDPMScheduler:
          num_train_timesteps: 1000
          beta_start: 0.0001
          beta_end: 0.02
          beta_schedule: linear
          clip_sample_range: 13
          prediction_type: epsilon
      classifier_free_guidance:
        p_uncond: 0.1
        guidance_weight: 1

    context_kwargs:
      use_past_ctx: false
      past_ctx_type: last
      past_ctx_weight: 0.1
      input_length: 13
      pred_length: 12

    sub_model:
      casformer:
        arch: DiT-custom
        config:
          input_size: 32
          in_channels: 8
          mlp_ratio: 4.0
          learn_sigma: false
          out_channels: 48
          split_num: 12
          num_heads: 16
          single_heads_num: 4
          hidden_size: 1152
          enc_hidden_size: 256
          patch_size: 2
          enc_depth: 12
          latent_depth: 12

      autoencoder_kl:
        in_channels: 1
        out_channels: 1
        down_block_types: ['DownEncoderBlock2D', 'DownEncoderBlock2D', 'DownEncoderBlock2D']
        up_block_types:   ['UpDecoderBlock2D', 'UpDecoderBlock2D', 'UpDecoderBlock2D']
        block_out_channels: [128, 256, 512]
        layers_per_block: 2
        latent_channels: 4
        norm_num_groups: 32

    save_best: MSE
    use_ceph: false
    metrics_type: "None"
    data_type: fp32

    extra_params:
      loss_type: MSELoss
      enabled_amp: false
      log_step: 20

    visualizer:
      visualizer_type: null
